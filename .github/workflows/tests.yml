name: tests

on:
  push:
    branches: [master]
  pull_request:

# No risky inputs used — matrix values are workflow-controlled, not from
# untrusted event payloads (issue titles, PR bodies, commit messages).

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run pytest
        run: pytest -q
